[package]
name = "ironjump"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"
description = "A Rust desktop port of the IronJump iPhone game"

[dependencies]
glam = "0.27"
macroquad = { version = "0.4.16", default-features = false, optional = true }
roxmltree = "0.21.1"

[features]
default = ["macroquad-backend"]
macroquad-backend = ["dep:macroquad"]
render-benchmark = ["macroquad-backend"]
frame-profile = ["macroquad-backend"]

[[bin]]
name = "ironjump"
path = "src/main.rs"
required-features = ["macroquad-backend"]

[package.metadata.android]
package_name = "org.ironjump.game"
label = "IronJump"
icon = "@mipmap/ic_launcher"
res = "android/res"
android_version = 36
target_sdk_version = 36
min_sdk_version = 26
build_targets = ["aarch64-linux-android"]
fullscreen = true

[package.metadata.android.activity_attributes]
"android:exported" = "true"
"android:screenOrientation" = "sensorLandscape"
"android:enableOnBackInvokedCallback" = "true"

[[package.metadata.android.feature]]
name = "android.hardware.sensor.accelerometer"
required = false
